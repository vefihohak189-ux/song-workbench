<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>歌曲工作台</title>
<style>
  :root{--bg:#0f1115;--card:#161a21;--line:#252b36;--fg:#e8ecf3;--dim:#8b93a3;--acc:#5b9dff;--warn:#ff6b5e;--ok:#39d98a;--gold:#ffc35b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"PingFang SC",sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#12161c}
  header h1{font-size:15px;margin:0 12px 0 0;letter-spacing:.5px}
  .grow{flex:1}
  button{background:#1d232c;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer}
  button:hover{border-color:#3a4557;background:#232a35}
  button.primary{background:#1b3a63;border-color:#2c5b96;color:#cfe2ff}
  button.warn{background:#3a1f1d;border-color:#5e2f2a;color:#ffb9b1}
  button:disabled{opacity:.45;cursor:not-allowed}
  select,input,textarea{background:#0d1015;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px/1.5 inherit}
  main{flex:1;display:grid;grid-template-columns:210px 1fr 380px;min-height:0}
  .col{overflow:auto;padding:10px;min-height:0}
  .col+.col{border-left:1px solid var(--line)}
  .side-t{font-size:11px;color:var(--dim);letter-spacing:1px;margin:2px 0 8px}
  .batch{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;background:var(--card)}
  .batch.on{border-color:var(--acc);background:#182233}
  .batch b{font-size:13px;display:block;font-weight:600}
  .batch span{font-size:11px;color:var(--dim)}
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;align-content:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;position:relative}
  .card.on{border-color:var(--acc);box-shadow:0 0 0 1px #2c5b96 inset}
  .card.conflict{border-color:#5e2f2a;background:#1e1614}
  .card h3{margin:0 0 3px;font-size:14px;font-weight:600;padding-right:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seq{position:absolute;right:10px;top:10px;font-size:11px;color:var(--dim)}
  .chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin:3px 4px 0 0}
  .chip.s0{color:#ffc35b;border-color:#4a3a1c}.chip.s1{color:#8fb8ff;border-color:#26374f}
  .chip.s2{color:#c9a0ff;border-color:#3a2a52}.chip.s3{color:#39d98a;border-color:#1c4030}
  .chip.s4{color:#39d98a;border-color:#1c4030}.chip.s5{color:#ffc35b;border-color:#4a3a1c}
  .chip.s6{color:#8b93a3}
  .meta{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.45;max-height:32px;overflow:hidden}
  .flag{font-size:11px;color:#ff8f85;margin-top:6px;line-height:1.4}
  .detail section{margin-bottom:14px}
  .detail label{display:block;font-size:11px;color:var(--dim);margin:8px 0 4px;letter-spacing:.5px}
  .detail textarea{width:100%;resize:vertical}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .files{list-style:none;padding:0;margin:6px 0 0}
  .files li{border:1px solid var(--line);border-radius:7px;padding:7px;margin-bottom:6px;background:#12161c}
  .files audio{width:100%;margin-top:5px;height:30px}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:30px 10px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d232c;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:70vw}
  #toast.on{opacity:1}
  .kbd{font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>歌曲工作台</h1>
  <select id="src" title="批次来源"><option value="">原创歌词.xlsx（只有歌名）</option></select>
  <input id="cnt" type="number" value="9" min="1" max="60" style="width:64px" title="数量">
  <button class="primary" onclick="newBatch()">新建批次</button>
  <button onclick="writeAll()">整批写词</button>
  <button onclick="styleAll()">整批定曲风</button>
  <button onclick="pushAll()">一键推送生成</button>
  <button onclick="poll()">轮询进度</button>
  <button onclick="sunoStat()">suno 连接</button>
  <span class="grow"></span>
  <span class="kbd" id="hint">就绪</span>
</header>
<main>
  <div class="col" id="batches"><div class="side-t">批次</div><div id="blist"></div></div>
  <div class="col"><div class="side-t">卡片墙</div><div id="groups"></div><div class="wall" id="wall"><div class="empty">先建一个批次</div></div></div>
  <div class="col detail" id="detail"><div class="empty">选一张卡片</div></div>
</main>
<div id="toast"></div>
<script>
let BATCH=null, CARDS=[], CONF={}, GROUPS=[], KINDS=0, SEL=null, FLOW=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600)}
async function api(path,body){
  const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});
  return r.json();
}
async function loadSources(){
  const j=await api("/api/sources");
  const s=$("src");
  (j.sources||[]).forEach(p=>{const o=document.createElement("option");o.value=p;o.textContent=p.split("/").slice(-2).join("/");s.appendChild(o)});
}
async function loadBatches(keep){
  const j=await api("/api/batches");
  const box=$("blist");box.innerHTML="";
  (j.batches||[]).forEach(b=>{
    const d=document.createElement("div");
    d.className="batch"+(b.id===BATCH?" on":"");
    d.innerHTML=`<b>${esc(b.name)}</b><span>${b.n} 首 · ${new Date(b.created*1000).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}</span>`;
    d.onclick=()=>{BATCH=b.id;SEL=null;loadBatches();loadCards()};
    box.appendChild(d);
  });
  if(!BATCH&&(j.batches||[]).length){BATCH=j.batches[0].id;loadBatches();loadCards();return}
  if(!BATCH){$("wall").innerHTML='<div class="empty">先建一个批次</div>';return}
  if(!CARDS.length){loadCards()}
}
async function loadCards(){
  if(!BATCH){$("wall").innerHTML='<div class="empty">先建一个批次</div>';return}
  const j=await api("/api/cards?batch="+BATCH);
  CARDS=j.cards||[];CONF=j.conflicts||{};GROUPS=j.groups||[];KINDS=j.core_kinds||0;FLOW=j.flow||[];
  const gbox=$("groups");
  if(GROUPS.length){
    gbox.innerHTML=`<div style="border:1px solid #5e2f2a;background:#1e1614;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12px">
      <b style="color:#ff8f85">同批编制核心重复 ${GROUPS.length} 组</b>
      ${GROUPS.map(g=>`<div class="kbd" style="margin-top:4px">${esc(g.sig)} ×${g.n}：${esc(g.titles.join("、"))}</div>`).join("")}
    </div>`;
  } else if(KINDS){ gbox.innerHTML=`<div class="kbd" style="margin-bottom:8px">编制核心 ${KINDS} 种，同批无重复 ✓</div>` }
  else { gbox.innerHTML="" }
  const wall=$("wall");wall.innerHTML="";
  if(!CARDS.length){wall.innerHTML='<div class="empty">这个批次没有卡片</div>';return}
  CARDS.forEach(c=>{
    const st=FLOW.indexOf(c.state);
    const d=document.createElement("div");
    d.className="card"+(c.id===SEL?" on":"")+(CONF[c.id]?" conflict":"");
    d.innerHTML=`<span class="seq">#${c.seq}</span><h3 title="${esc(c.title)}">${esc(c.title||"未命名")}</h3>
      <div><span class="chip s${st}">${esc(c.state)}</span>${c.score?`<span class="chip">${esc(c.score)}</span>`:""}${c.role?`<span class="chip">${esc(c.role)}</span>`:""}</div>
      <div class="meta">${esc(c.genre||"—")}</div>
      ${CONF[c.id]?`<div class="flag">⚠ ${esc(CONF[c.id].join("；"))}</div>`:""}`;
    d.onclick=()=>{SEL=c.id;loadCards()};
    wall.appendChild(d);
  });
  const nf=Object.keys(CONF).length;
  const rep=Object.keys(CONF).length;
  $("hint").textContent=`${CARDS.length} 首 · 编制核心 ${KINDS} 种${rep?` · ${rep} 首重复`:""}`;
  if(SEL){const c=CARDS.find(x=>x.id===SEL);if(c&&$("detail").dataset.sel!=String(SEL))renderDetail(c)}
}
function renderDetail(c){
  const box=$("detail");box.dataset.sel=String(c.id);
  const st=FLOW.indexOf(c.state);
  const files=(c.files||[]).map((f,i)=>`<li><div class="row"><b style="font-size:12px">版本 ${i+1}</b>
     <span class="kbd">${esc(f.name||"")}</span><span class="grow"></span>
     <button onclick="pick(${c.id},${i})">选这版</button></div>
     <audio controls preload="none" src="${esc(f.url)}"></audio></li>`).join("");
  box.innerHTML=`<div class="side-t">卡片详情</div>
    <section>
      <label>歌曲名</label><input id="f_title" value="${esc(c.title)}" style="width:100%">
      <div class="row" style="margin-top:8px">
        <span class="chip s${st}">${esc(c.state)}</span>
        ${CONF[c.id]?`<span class="chip" style="color:#ff8f85">同质化</span>`:""}
        ${c.job?`<span class="kbd">suno 任务 ${esc(c.job)}</span>`:""}
      </div>
      ${c.note?`<div class="flag" style="margin-top:6px">${esc(c.note)}</div>`:""}
      </div>
    </section>
    <section>
      <label>演唱身份</label><input id="f_role" value="${esc(c.role)}" style="width:100%">
      <label>曲风（仅展示）</label><input id="f_genre" value="${esc(c.genre)}" style="width:100%">
      <label>Suno 指令（真正喂给生成的 tags）</label>
      <textarea id="f_suno" rows="4">${esc(c.suno)}</textarea>
      <label>歌词</label><textarea id="f_lyrics" rows="12">${esc(c.lyrics)}</textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" onclick="save(${c.id})">保存判定</button>
        <button onclick="writeOne(${c.id})">写词</button>
        <button onclick="styleOne(${c.id})">定曲风</button>
        <button onclick="pushOne(${c.id})">推送这首</button>
        <span class="grow"></span>
        <span class="kbd">编制核心：${esc(c.sig||"—")}</span>
      </div>
    </section>
    <section>
      <label>生成的版本</label>
      ${files?`<ul class="files">${files}</ul>`:`<div class="kbd">还没生成。推送后点「轮询进度」拉取。</div>`}
      ${c.delivered?`<div class="kbd" style="margin-top:6px">已交付：${esc(c.delivered)} <button onclick="reveal('${esc(c.delivered)}')">在访达显示</button></div>`:""}
    </section>`;
}
async function save(id){
  const body={id,title:$("f_title").value,role:$("f_role").value,genre:$("f_genre").value,suno:$("f_suno").value,lyrics:$("f_lyrics").value};
  const j=await api("/api/song/save",body);
  if(j.ok){toast("已保存");loadCards()}else toast(j.error||"保存失败");
}
async function writeOne(id){
  $("hint").textContent="写词中…";
  const j=await api("/api/song/write",{id});
  toast(j.ok?`歌词已生成 ${j.chars} 字`:(j.error||"写词失败"));loadCards();
}
async function styleOne(id){
  $("hint").textContent="定曲风中…";
  const j=await api("/api/song/style",{id});
  toast(j.ok?"曲风已定（会避开同批已用编制）":(j.error||"失败"));loadCards();
}
async function writeAll(){
  if(!BATCH)return toast("先建批次");
  if(!confirm("给这一批所有没歌词的卡片逐首写词？会调用你 suno-panel 里配置的模型。"))return;
  $("hint").textContent="整批写词中…";
  const j=await api("/api/batch/write",{batch:BATCH});
  toast(`写了 ${j.written} 首${(j.failed||[]).length?"，失败 "+j.failed.length:""}`);loadCards();
}
async function styleAll(){
  if(!BATCH)return toast("先建批次");
  $("hint").textContent="整批定曲风中…";
  const j=await api("/api/batch/style",{batch:BATCH});
  toast(`定了 ${j.styled} 首${(j.failed||[]).length?"，失败 "+j.failed.length:""}`);loadCards();
}
async function pushOne(id){
  $("hint").textContent="推送中…";
  const j=await api("/api/song/push",{id});
  toast(j.ok?`已进队列 ${j.job}`:(j.error||"推送失败"));
  loadCards();
}
async function pushAll(){
  if(!BATCH)return toast("先建批次");
  if(!confirm("把这一批里已具备歌词+指令的卡片全部推到 suno？会消耗账号积分。"))return;
  $("hint").textContent="批量推送中…";
  const j=await api("/api/batch/push",{batch:BATCH});
  const ok=(j.results||[]).filter(r=>r.ok).length;
  toast(`已推送 ${ok}/${(j.results||[]).length}`);
  loadCards();
}
async function poll(){
  if(!BATCH)return toast("先建批次");
  const j=await api("/api/poll",{batch:BATCH});
  toast(j.ok?`已同步 ${j.changed} 首`:(j.error||"轮询失败"));
  loadCards();
}
async function pick(id,index){
  const j=await api("/api/song/pick",{id,index});
  toast(j.ok?("已落交付："+j.delivered.split("/").pop()):(j.error||"选版失败"));
  loadCards();
}
async function reveal(path){await api("/api/reveal",{path})}
async function newBatch(){
  const body={count:+$("cnt").value,source:$("src").value||null,name:null};
  const j=await api("/api/batch/new",body);
  if(j.ok){BATCH=j.batch;await loadBatches();loadCards();toast(`建好了：${j.count} 首`)}else toast(j.error||"失败");
}
async function sunoStat(){
  const j=await api("/api/suno");
  toast(j.ok?`suno-panel 在线，最近 ${j.jobs.length} 个任务`:(j.error||"suno-panel 不在线"));
}
loadSources();loadBatches();
</script>
</body>
</html>
